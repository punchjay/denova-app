version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    ignore:
      # typescript-eslint 8.x declares peer typescript ">=4.8.4 <6.1.0", so a
      # major bump to typescript 7 fails `npm ci` with ERESOLVE. Hold at 6.x
      # until typescript-eslint widens its peer range, then drop this entry.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    groups:
      dev-dependencies:
        dependency-type: development
      production-dependencies:
        dependency-type: production
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
